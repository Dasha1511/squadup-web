# /etc/nginx/sites-available/squadup.conf
# Сайт squadup.ru. HTTPS-строки добавит certbot (этап публикации).

server {
    listen 80;
    listen [::]:80;
    server_name squadup.ru www.squadup.ru;

    root /var/www/squadup-web/dist;
    index index.html;

    # Отдельный журнал сайта — по нему делается ЛР №1 (лог-анализаторы)
    access_log /var/log/nginx/squadup.access.log combined;
    error_log  /var/log/nginx/squadup.error.log warn;

    # www → без www
    if ($host = www.squadup.ru) { return 301 $scheme://squadup.ru$request_uri; }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain application/json;

    # Форма «Узнать о запуске»
    location = /api/subscribe {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        client_max_body_size 4k;
    }

    # Файлы сборки с хешем в имени — кешируем надолго
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(webp|png|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
