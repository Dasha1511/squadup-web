# /etc/nginx/snippets/squadup-subscribe.conf
# Подключается в server-блок api.squadup.ru (include snippets/squadup-subscribe.conf;).
# Принимает форму «Узнать о запуске» с сайта squadup.ru (GitHub Pages).

location = /api/subscribe {
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "https://squadup.ru" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Access-Control-Max-Age 86400 always;
        return 204;
    }
    add_header Access-Control-Allow-Origin "https://squadup.ru" always;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    client_max_body_size 4k;
}
